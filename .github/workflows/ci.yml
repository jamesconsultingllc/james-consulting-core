name: CI

# GitFlow Pattern B — single workflow file (required so NuGet Trusted
# Publishing can match on a stable filename).
#
#   - Push to any tracked branch / PR / workflow_dispatch -> build-test only
#   - Push to release/**                                  -> build-test + publish-rc
#                                                            (version: <major>.<minor>.0-rc.<run_number>)
#   - Push tag v*                                         -> build-test + publish-stable
#                                                            (version: <major>.<minor>.<patch>; tag must equal version.json
#                                                             AND commit must be reachable from the stable branch)
on:
  push:
    branches: [develop, main, master, 'feature/**', 'release/**', 'hotfix/**']
    tags:     ['v*']
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:

# Cancel stale runs on branch pushes; never cancel a tag publish mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read
  pull-requests: read

env:
  PACKAGE_PROJECT: src/JamesConsulting/JamesConsulting.csproj
  # Run JavaScript-based actions on Node.js 24 now (default starting June 2026).
  # Silences the "Node.js 20 actions are deprecated" warning on the runner.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SOLUTION: src/JamesConsulting.sln
  STABLE_BRANCH: master  # branch from which v* tags must be cut

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Always-on gating job. Fast feedback loop on Linux for every push/PR/tag.
  # ─────────────────────────────────────────────────────────────────────────
  build-test:
    name: Build, Test, Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: write   # actions/upload-artifact@v4 uses the Actions API to create artifact records.
    env:
      # Sonar runs only on pushes from this repo (not fork PRs) where SONAR_TOKEN
      # is available. Forked PRs can't access secrets, so SONAR_TOKEN would be
      # empty and the begin step would fail. Gating on this env (not directly on
      # secrets, which can't appear in `if:`) skips Sonar cleanly for forks.
      SONAR_TOKEN_SET: ${{ secrets.SONAR_TOKEN != '' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # NBGV + Sonar both need full history

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup Java (Sonar scanner requires JRE)
        if: ${{ vars.SONAR_PROJECT_KEY != '' && env.SONAR_TOKEN_SET == 'true' }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Install Sonar scanner
        if: ${{ vars.SONAR_PROJECT_KEY != '' && env.SONAR_TOKEN_SET == 'true' }}
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin Sonar analysis
        if: ${{ vars.SONAR_PROJECT_KEY != '' && env.SONAR_TOKEN_SET == 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" \
            /o:"${{ vars.SONAR_ORG }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/*Tests/**,**/*.Tests/**"

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Test (with coverage)
        run: |
          dotnet test "$SOLUTION" \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End Sonar analysis
        if: ${{ vars.SONAR_PROJECT_KEY != '' && env.SONAR_TOKEN_SET == 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Pack (preview, for artifact only)
        # CI suffix prevents accidental consumption of an unpublished build.
        # publish-rc / publish-stable below produce the real signed packages.
        run: |
          dotnet pack "$PACKAGE_PROJECT" \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:VersionSuffix="ci.${{ github.run_number }}"

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nupkg-${{ github.run_number }}
          path: |
            ./artifacts/*.nupkg
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ github.run_number }}
          path: '**/TestResults/**/*.trx'
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # RC publish — release/** branches only. Only runs after build-test passes.
  # ─────────────────────────────────────────────────────────────────────────
  publish-rc:
    name: Sign & Publish RC
    needs: build-test
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: windows-latest  # Trusted Signing CLI calls Windows-only APIs.
    environment: release

    permissions:
      id-token: write   # Required for OIDC (azure/login + NuGet/login)
      contents: read
      actions: write   # actions/upload-artifact@v4 uses the Actions API to create artifact records.

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Determine RC version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(dotnet nbgv get-version -p src/JamesConsulting -v NuGetPackageVersion)
          if [ -z "$VERSION" ]; then
            echo "::error::nbgv returned empty NuGetPackageVersion"
            exit 1
          fi
          if [[ ! "$VERSION" =~ -rc(\.[0-9]+)?$ ]]; then
            echo "::error::Expected RC version on release/* branch but got '$VERSION'. Is version.json set to '<MAJOR>.<MINOR>.<PATCH>-rc'?"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION (rc) from $PACKAGE_PROJECT"

      - name: Restore
        run: dotnet restore $env:SOLUTION

      - name: Build
        env:
          CI: 'true'
        run: dotnet build $env:SOLUTION --configuration Release --no-restore

      - name: Pack
        shell: bash
        run: |
          dotnet pack "$PACKAGE_PROJECT" \
            --configuration Release \
            --no-build \
            --output ./artifacts

      # ----- Azure Trusted Signing -----
      # Federated credential required on the Entra app behind AZURE_CLIENT_ID:
      #   Subject:  repo:jamesconsultingllc/james-consulting-core:environment:release
      #   Issuer:   https://token.actions.githubusercontent.com
      #   Audience: api://AzureADTokenExchange
      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install dotnet sign
        shell: pwsh
        run: dotnet tool install --global sign --version ${{ vars.SIGN_TOOL_VERSION || '0.9.1-beta.24469.1' }}

      - name: Sign nupkg(s)
        shell: pwsh
        run: |
          sign code trusted-signing `
            --trusted-signing-endpoint "${{ vars.TRUSTED_SIGNING_ENDPOINT }}" `
            --trusted-signing-account "${{ vars.TRUSTED_SIGNING_ACCOUNT }}" `
            --trusted-signing-certificate-profile "${{ vars.TRUSTED_SIGNING_PROFILE }}" `
            --base-directory "$(Get-Location)\artifacts" `
            "*.nupkg"

      - name: Extract signing leaf cert
        id: extract-cert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $nupkg = Get-ChildItem .\artifacts\*.nupkg | Select-Object -First 1
          if (-not $nupkg) { throw "No signed .nupkg found in .\artifacts" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try {
            $entry = $zip.GetEntry('.signature.p7s')
            if (-not $entry) { throw "No .signature.p7s in $($nupkg.Name) — package was not signed" }
            $ms = New-Object System.IO.MemoryStream
            $s  = $entry.Open(); $s.CopyTo($ms); $s.Dispose()
            $sigBytes = $ms.ToArray()
          } finally { $zip.Dispose() }
          $cms = New-Object System.Security.Cryptography.Pkcs.SignedCms
          $cms.Decode($sigBytes)
          $leaf = $cms.SignerInfos[0].Certificate
          $ver = '${{ steps.version.outputs.version }}'
          $cerPath = ".\artifacts\signing-cert-$ver.cer"
          [System.IO.File]::WriteAllBytes($cerPath, $leaf.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          $fp = $leaf.GetCertHashString('SHA256')
          Write-Host "Leaf cert    : $($leaf.Subject)"
          Write-Host "SHA-256      : $fp"
          Write-Host "NotBefore    : $($leaf.NotBefore.ToString('o'))"
          Write-Host "NotAfter     : $($leaf.NotAfter.ToString('o'))"
          Write-Host "Wrote        : $cerPath"
          "fingerprint=$fp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cer-path=$cerPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # Surface in job summary so it's visible without downloading the artifact.
          @"
          ## Signing certificate

          | Field    | Value |
          |----------|-------|
          | Subject  | $($leaf.Subject) |
          | Issuer   | $($leaf.Issuer) |
          | SHA-256  | ``$fp`` |
          | Valid    | $($leaf.NotBefore.ToString('u')) → $($leaf.NotAfter.ToString('u')) |

          If nuget.org rejects the package with a fingerprint mismatch, register the
          ``signing-cert-$ver`` artifact (the ``.cer`` file) at https://www.nuget.org/account/Certificates.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # ----- NuGet Trusted Publishing (OIDC, no API key) -----
      # NUGET_USER must be the nuget.org USERNAME of the trust-policy CREATOR.
      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        shell: bash
        run: |
          set -euo pipefail
          # `dotnet nuget push` does not expand globs and bash does not
          # expand them inside double quotes — enumerate explicitly with
          # `compgen -G` (which handles "no matches" without erroring under
          # `set -e`) and push each file individually. `--skip-duplicate`
          # keeps the job idempotent across retries.
          mapfile -t NUPKGS < <(compgen -G "./artifacts/*.nupkg" || true)
          if [ "${#NUPKGS[@]}" -eq 0 ]; then
            echo "::error::No .nupkg files found in ./artifacts to push."
            exit 1
          fi
          for pkg in "${NUPKGS[@]}"; do
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Upload signed package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-${{ steps.version.outputs.version }}
          path: |
            ./artifacts/*.nupkg
          retention-days: 90

      - name: Upload signing certificate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signing-cert-${{ steps.version.outputs.version }}
          path: ./artifacts/signing-cert-*.cer
          retention-days: 365

      # ─────────────────────────────────────────────────────────────────────────
      # Stable publish — only on v* tags. Verifies tag matches version.json
      # and that the tagged commit is reachable from $STABLE_BRANCH.
      # ─────────────────────────────────────────────────────────────────────────
  publish-stable:
    name: Sign & Publish Stable
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: release

    permissions:
      id-token: write
      contents: write  # Required by softprops/action-gh-release. RC job does not get this.
      actions: write   # actions/upload-artifact@v4 uses the Actions API to create artifact records.

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Determine stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # Tag must be a clean stable v<MAJOR>.<MINOR>.<PATCH>.
          if [[ ! "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable tags must match v<MAJOR>.<MINOR>.<PATCH> exactly. Got: ${GITHUB_REF#refs/tags/}"
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"

          # NBGV computes the version from version.json + branch state; on a
          # tagged commit reachable from $STABLE_BRANCH (a public release ref)
          # it must produce exactly the tag version (no prerelease, no metadata).
          NBGV_VERSION=$(dotnet nbgv get-version -p src/JamesConsulting -v NuGetPackageVersion)
          if [ "$NBGV_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match nbgv-computed version '$NBGV_VERSION'. Bump version.json on $STABLE_BRANCH to '$TAG_VERSION' before tagging."
            exit 1
          fi

          # Tag commit must be on $STABLE_BRANCH so we cannot ship an untested SHA.
          # checkout uses fetch-depth: 0, so the full history is already present;
          # this fetch just refreshes the remote ref. Avoid invalid '--depth=0' —
          # git rejects it, so any fallback would always run twice.
          git fetch origin "$STABLE_BRANCH" >/dev/null 2>&1 || git fetch origin "$STABLE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$STABLE_BRANCH"; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} points at $GITHUB_SHA which is not on origin/$STABLE_BRANCH. Stable tags must be cut from $STABLE_BRANCH."
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG_VERSION (stable) from $PACKAGE_PROJECT"

      - name: Restore
        run: dotnet restore $env:SOLUTION

      - name: Build
        env:
          CI: 'true'
        run: dotnet build $env:SOLUTION --configuration Release --no-restore

      - name: Pack
        shell: bash
        run: |
          dotnet pack "$PACKAGE_PROJECT" \
            --configuration Release \
            --no-build \
            --output ./artifacts

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install dotnet sign
        shell: pwsh
        run: dotnet tool install --global sign --version ${{ vars.SIGN_TOOL_VERSION || '0.9.1-beta.24469.1' }}

      - name: Sign nupkg(s)
        shell: pwsh
        run: |
          sign code trusted-signing `
            --trusted-signing-endpoint "${{ vars.TRUSTED_SIGNING_ENDPOINT }}" `
            --trusted-signing-account "${{ vars.TRUSTED_SIGNING_ACCOUNT }}" `
            --trusted-signing-certificate-profile "${{ vars.TRUSTED_SIGNING_PROFILE }}" `
            --base-directory "$(Get-Location)\artifacts" `
            "*.nupkg"

      - name: Extract signing leaf cert
        id: extract-cert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $nupkg = Get-ChildItem .\artifacts\*.nupkg | Select-Object -First 1
          if (-not $nupkg) { throw "No signed .nupkg found in .\artifacts" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try {
            $entry = $zip.GetEntry('.signature.p7s')
            if (-not $entry) { throw "No .signature.p7s in $($nupkg.Name) — package was not signed" }
            $ms = New-Object System.IO.MemoryStream
            $s  = $entry.Open(); $s.CopyTo($ms); $s.Dispose()
            $sigBytes = $ms.ToArray()
          } finally { $zip.Dispose() }
          $cms = New-Object System.Security.Cryptography.Pkcs.SignedCms
          $cms.Decode($sigBytes)
          $leaf = $cms.SignerInfos[0].Certificate
          $ver = '${{ steps.version.outputs.version }}'
          $cerPath = ".\artifacts\signing-cert-$ver.cer"
          [System.IO.File]::WriteAllBytes($cerPath, $leaf.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          $fp = $leaf.GetCertHashString('SHA256')
          Write-Host "Leaf cert    : $($leaf.Subject)"
          Write-Host "SHA-256      : $fp"
          Write-Host "NotBefore    : $($leaf.NotBefore.ToString('o'))"
          Write-Host "NotAfter     : $($leaf.NotAfter.ToString('o'))"
          Write-Host "Wrote        : $cerPath"
          "fingerprint=$fp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cer-path=$cerPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          @"
          ## Signing certificate

          | Field    | Value |
          |----------|-------|
          | Subject  | $($leaf.Subject) |
          | Issuer   | $($leaf.Issuer) |
          | SHA-256  | ``$fp`` |
          | Valid    | $($leaf.NotBefore.ToString('u')) → $($leaf.NotAfter.ToString('u')) |

          If nuget.org rejects the package with a fingerprint mismatch, register the
          ``signing-cert-$ver`` artifact (the ``.cer`` file) at https://www.nuget.org/account/Certificates.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        shell: bash
        run: |
          set -euo pipefail
          # `dotnet nuget push` does not expand globs and bash does not
          # expand them inside double quotes — enumerate explicitly with
          # `compgen -G` (which handles "no matches" without erroring under
          # `set -e`) and push each file individually. `--skip-duplicate`
          # keeps the job idempotent across retries.
          mapfile -t NUPKGS < <(compgen -G "./artifacts/*.nupkg" || true)
          if [ "${#NUPKGS[@]}" -eq 0 ]; then
            echo "::error::No .nupkg files found in ./artifacts to push."
            exit 1
          fi
          for pkg in "${NUPKGS[@]}"; do
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Upload signed package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-${{ steps.version.outputs.version }}
          path: |
            ./artifacts/*.nupkg
          retention-days: 90

      - name: Upload signing certificate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signing-cert-${{ steps.version.outputs.version }}
          path: ./artifacts/signing-cert-*.cer
          retention-days: 365

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ./artifacts/*.nupkg
            ./artifacts/signing-cert-*.cer
